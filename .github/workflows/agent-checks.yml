name: agent-checks

on:
  pull_request:

# repo นี้ public: ให้ workflow อ่านโค้ดได้อย่างเดียว
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check rules
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/agent-checks/test.sh
          scripts/agent-checks/repo/commit-identity.sh "$BASE..$HEAD"
          scripts/agent-checks/repo/private-info.sh "$BASE...$HEAD"
